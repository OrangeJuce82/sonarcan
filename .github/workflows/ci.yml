name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build

  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Run TypeScript tests
        run: npm run test
      - name: Verify native-only release boundary
        run: npm run verify:native-release
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: npm run format:rust
      - name: Lint Rust
        shell: bash
        run: |
          if npm run lint:rust > rust-lint.log 2>&1; then
            cat rust-lint.log
          else
            tail -120 rust-lint.log
            diagnostic="$(grep -E '^(error(\[E[0-9]+\])?:|error: could not)' rust-lint.log | head -1 || true)"
            diagnostic="${diagnostic:-$(tail -20 rust-lint.log | tr '\n' ' ')}"
            diagnostic="${diagnostic:-Rust lint failed without output}"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Rust lint failed::$diagnostic"
            exit 1
          fi
      - name: Run Rust tests
        run: npm run test:rust
      - run: npm run build:ci

  executorch-runtime:
    name: ExecuTorch runtime (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            cuda_repository: ubuntu2204/x86_64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            cuda_repository: ubuntu2404/sbsa
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pytorch/executorch
          ref: v1.4.1
          submodules: recursive
          path: vendor/executorch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the Apple Metal compiler used to build the MLX delegate
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Install CUDA 12.6 build toolkit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda_repository }}/cuda-keyring_1.1-1_all.deb" \
            --output "$RUNNER_TEMP/cuda-keyring.deb"
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-12-6
      - run: python -m pip install "cmake>=3.29,<4" "PyYAML==6.0.3" "torch==2.13.0"
      - run: npm ci
      - name: Build selective native worker
        shell: bash
        env:
          SONARCAN_EXECUTORCH_SOURCE: ${{ github.workspace }}/vendor/executorch
          SONARCAN_EXECUTORCH_PYTHON: ${{ env.pythonLocation }}/python
          SONARCAN_EXECUTORCH_BUILD_DIR: ${{ runner.temp }}/sonarcan-executorch-build
          SONARCAN_EXECUTORCH_CUDA: ${{ runner.os == 'Linux' && '1' || '0' }}
          SONARCAN_EXECUTORCH_MLX: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          if npm run executorch:runtime > executorch-build.log 2>&1; then
            cat executorch-build.log
          else
            tail -100 executorch-build.log
            diagnostic="$(grep -E '(^|[ :])(error C[0-9]+|fatal error|CMake Error|FAILED:|error:)' executorch-build.log | tail -1 || true)"
            diagnostic="${diagnostic:-ExecuTorch build failed without a compiler diagnostic}"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=ExecuTorch runtime build failed::$diagnostic"
            exit 1
          fi
      - name: Verify native worker contract
        shell: bash
        run: |
          worker="src-tauri/resources/executorch-runtime/sonarcan-executorch-worker"
          chmod 755 "$worker"
          test "$("$worker" --version)" = "sonarcan-executorch-worker 1.4.1 SACTEN01"
