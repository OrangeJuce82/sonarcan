name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run test:mlx
      - run: npm run build

  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            edition: light
          - name: Windows x64
            os: windows-2025
            edition: light
          - name: macOS Apple Silicon
            os: macos-15
            edition: full
          - name: macOS Intel Light
            os: macos-15-intel
            edition: light
    runs-on: ${{ matrix.os }}
    env:
      SONARCAN_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install uv for the Full worker tests
        if: matrix.edition == 'full'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.26"
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run test:mlx
      - run: npm run test:stems
      - run: npm run test:chords
      - run: npm run format:rust
      - run: npm run lint:rust
      - run: npm run test:rust
      - run: npm run build:ci
