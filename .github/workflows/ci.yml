name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - name: Run dependency-free worker contract tests
        run: npm run test:mlx
      - run: npm run build

  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Run TypeScript tests
        run: npm run test
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: npm run format:rust
      - name: Lint Rust
        shell: bash
        run: |
          if npm run lint:rust > rust-lint.log 2>&1; then
            cat rust-lint.log
          else
            tail -120 rust-lint.log
            diagnostic="$(grep -E '^(error(\[E[0-9]+\])?:|error: could not)' rust-lint.log | head -1 || true)"
            diagnostic="${diagnostic:-Rust lint failed without a compiler diagnostic}"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Rust lint failed::$diagnostic"
            exit 1
          fi
      - name: Run Rust tests
        run: npm run test:rust
      - run: npm run build:ci

  executorch-runtime:
    name: ExecuTorch runtime (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pytorch/executorch
          ref: v1.4.1
          submodules: recursive
          path: vendor/executorch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML==6.0.3" "torch==2.14.0"
      - run: npm ci
      - name: Build selective native worker
        shell: bash
        env:
          SONARCAN_EXECUTORCH_SOURCE: ${{ github.workspace }}/vendor/executorch
          SONARCAN_EXECUTORCH_PYTHON: ${{ env.pythonLocation }}/python
          SONARCAN_EXECUTORCH_BUILD_DIR: ${{ runner.temp }}/sonarcan-executorch-build
        run: |
          if npm run executorch:runtime > executorch-build.log 2>&1; then
            cat executorch-build.log
          else
            tail -100 executorch-build.log
            diagnostic="$(grep -E '(^|[ :])(error C[0-9]+|fatal error|CMake Error|FAILED:|error:)' executorch-build.log | tail -1 || true)"
            diagnostic="${diagnostic:-ExecuTorch build failed without a compiler diagnostic}"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=ExecuTorch runtime build failed::$diagnostic"
            exit 1
          fi
      - name: Verify native worker contract
        shell: bash
        run: |
          worker="src-tauri/resources/executorch-runtime/sonarcan-executorch-worker"
          if [[ "${{ runner.os }}" == "Windows" ]]; then worker="$worker.exe"; else chmod 755 "$worker"; fi
          test "$("$worker" --version)" = "sonarcan-executorch-worker 1.4.1 SACTEN01"
