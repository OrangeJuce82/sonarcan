name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - name: Run dependency-free worker contract tests
        run: npm run test:mlx
      - run: npm run build

  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Run shared application quality gate
        run: npm run quality:shared
      - run: npm run build:ci

  executorch-runtime:
    name: ExecuTorch runtime (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pytorch/executorch
          ref: v1.4.1
          submodules: recursive
          path: vendor/executorch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML==6.0.3" "torch==2.14.0"
      - run: npm ci
      - name: Build selective native worker
        shell: bash
        env:
          SONARCAN_EXECUTORCH_SOURCE: ${{ github.workspace }}/vendor/executorch
          SONARCAN_EXECUTORCH_PYTHON: ${{ env.pythonLocation }}/python
          SONARCAN_EXECUTORCH_BUILD_DIR: ${{ runner.temp }}/sonarcan-executorch-build
        run: npm run executorch:runtime
      - name: Verify native worker contract
        shell: bash
        run: |
          worker="src-tauri/resources/executorch-runtime/sonarcan-executorch-worker"
          if [[ "${{ runner.os }}" == "Windows" ]]; then worker="$worker.exe"; else chmod 755 "$worker"; fi
          test "$("$worker" --version)" = "sonarcan-executorch-worker 1.4.1 SACTEN01"
