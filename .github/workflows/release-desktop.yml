name: Release desktop

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:release-version
      - name: Verify pinned Windows/Linux FFmpeg sources
        run: npm run verify:audio-tools-source
      - name: Recreate draft release before parallel uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft_ids="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id"
          )"

          while IFS= read -r draft_id; do
            if [[ -n "$draft_id" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$draft_id"
            fi
          done <<< "$draft_ids"

          release_args=(--draft --notes-file RELEASE_NOTES.md --title "SonArcan $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${release_args[@]}"

  release-macos:
    name: Release macOS Apple Silicon
    needs: prepare-release
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Apple Silicon requires signed executable code. The ad-hoc identity keeps
      # the bundle internally consistent without claiming Apple verification.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            tools/sonarcan-python-runtime/uv.lock
            tools/sonarcan-mlx-worker/uv.lock
            tools/sonarcan-chord-worker/uv.lock
      - name: Install pinned Python runtime
        run: uv python install 3.13.5
      - run: npm ci
      - run: npm run verify:release-version
      - name: Prepare pinned Beat This! model
        run: npm run chords:downbeat-model
      - name: Assemble shared Python 3.13 runtime
        run: npm run python:runtime
      - run: npm run verify:stem-release
      - run: npm run verify:chord-release
      - name: Prepare pinned yt-dlp search artifact
        run: npm run ytdlp:search
      - run: npm run verify:ytdlp-search-release
      - name: Restore pinned FFmpeg runtime
        id: ffmpeg-runtime-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/resources/audio-tools
          key: ffmpeg-8.0.3-lame-3.100-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg-runtime.sh') }}
      - name: Assemble pinned FFmpeg runtime
        if: steps.ffmpeg-runtime-cache.outputs.cache-hit != 'true'
        run: npm run ffmpeg:runtime
      - run: npm run verify:ffmpeg-release
      - name: Qualify MLX separation performance
        run: npm run qualify:stem-performance
      - name: Run application quality gate
        run: npm run quality
      - name: Ad-hoc sign embedded release binaries
        run: npm run sign:release-resources
      - name: Build ad-hoc signed app and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SonArcan ${{ github.ref_name }}
          generateReleaseNotes: false
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.macos-arm.conf.json
      - name: Verify bundled macOS resources
        env:
          # The verification invokes the bundled interpreter after ad-hoc
          # signing; bytecode writes would invalidate its code signatures.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          app_bundle="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SonArcan.app"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          codesign --display --verbose=4 "$app_bundle" 2>&1 | grep -F "Signature=adhoc"
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app_bundle/Contents/Info.plist")"
          test -n "$icon_name"
          test -s "$app_bundle/Contents/Resources/$icon_name"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSTypeIsPackage' "$app_bundle/Contents/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$app_bundle/Contents/Info.plist")" = "music.sonarcan.project"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeIdentifier' "$app_bundle/Contents/Info.plist")" = "music.sonarcan.project"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeConformsTo:0' "$app_bundle/Contents/Info.plist")" = "com.apple.package"
          test -x "$app_bundle/Contents/Resources/audio-tools/bin/ffmpeg"
          test -x "$app_bundle/Contents/Resources/audio-tools/bin/ffprobe"
          "$app_bundle/Contents/Resources/audio-tools/bin/ffmpeg" -hide_banner -version
          "$app_bundle/Contents/Resources/audio-tools/bin/ffprobe" -hide_banner -version
          "$app_bundle/Contents/Resources/python-runtime/runtime/bin/python3.13" -c "from sonarcan_chord_worker.engine import verify_checkpoints; verify_checkpoints()"
          "$app_bundle/Contents/Resources/python-runtime/runtime/bin/python3.13" "$app_bundle/Contents/Resources/ytdlp-search/yt-dlp" --version
          npm run verify:bundled-release -- "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
      - name: Generate DMG checksum
        run: |
          dmg_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          dmg_path="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          cd "$dmg_dir"
          shasum -a 256 "$(basename "$dmg_path")" > SHA256SUMS.txt
          shasum -a 256 --check SHA256SUMS.txt
      - name: Upload DMG checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" \
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt \
              --clobber; then
              exit 0
            fi
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
  release-linux-gpu:
    name: Release Linux x64 ${{ matrix.label }} DEB
    needs: prepare-release
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: NVIDIA GPU
            backend: nvidia
            config: src-tauri/tauri.nvidia-gpu.conf.json
          - label: AMD GPU
            backend: amd
            config: src-tauri/tauri.amd-gpu.conf.json
    runs-on: ubuntu-22.04
    env:
      SONARCAN_GPU_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            tools/sonarcan-python-runtime-cuda/uv.lock
            tools/sonarcan-python-runtime-rocm/uv.lock
            tools/sonarcan-chord-worker/uv.lock
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf
      - run: uv python install 3.13.5
      - run: npm ci
      - run: npm run verify:release-version
      - run: npm run chords:downbeat-model
      - run: npm run python:runtime
      - run: npm run verify:stem-release
      - run: npm run verify:chord-release
      - run: npm run verify:gpu-runtime
      - run: npm run ytdlp:search
      - run: npm run verify:ytdlp-search-release
      - run: npm run ffmpeg:runtime
      - run: npm run verify:ffmpeg-release
      - name: Run application quality gate
        run: npm run quality
      - name: Free build caches before the large GPU package
        run: |
          uv_cache_dir="$(uv cache dir)"
          uv cache clean
          mkdir -p "$uv_cache_dir"
          cargo clean --manifest-path src-tauri/Cargo.toml
      # GPU runtimes are larger than GitHub's 2 GiB per-asset limit, so the DEB
      # is split into independently verifiable release assets.
      - name: Build GPU DEB
        run: npm exec tauri build -- --target x86_64-unknown-linux-gnu --bundles deb --config ${{ matrix.config }}
      - name: Verify and upload multipart Linux GPU DEB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verification_root="$(mktemp -d)"
          deb_path="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_path"
          dpkg-deb -x "$deb_path" "$verification_root/deb"
          npm run verify:bundled-release -- "$verification_root/deb"
          rm -rf "$verification_root"

          backend_name="$(printf '%s' '${{ matrix.backend }}' | tr '[:lower:]' '[:upper:]')"
          portable_name="SonArcan-Linux-x86_64-${backend_name}-GPU-${GITHUB_REF_NAME}.deb"
          portable_path="$RUNNER_TEMP/$portable_name"
          mv "$deb_path" "$portable_path"
          split -b 1800M -d -a 3 "$portable_path" "$portable_path.part-"
          rm -f "$portable_path"
          checksum_path="$RUNNER_TEMP/SHA256SUMS-Linux-${backend_name}-GPU-DEB.txt"
          (cd "$RUNNER_TEMP" && sha256sum "$portable_name".part-* > "$(basename "$checksum_path")")
          (cd "$RUNNER_TEMP" && sha256sum --check "$(basename "$checksum_path")")
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" "$portable_path".part-* "$checksum_path" --clobber; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
          rm -f "$portable_path".part-* "$checksum_path"

  release-windows-gpu:
    name: Release Windows x64 NVIDIA GPU
    needs: prepare-release
    timeout-minutes: 180
    runs-on: windows-2025
    env:
      SONARCAN_GPU_BACKEND: nvidia
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            tools/sonarcan-python-runtime-cuda/uv.lock
            tools/sonarcan-chord-worker/uv.lock
      - run: uv python install 3.13.5
      - run: npm ci
      - run: npm run verify:release-version
      - run: npm run chords:downbeat-model
      - run: npm run python:runtime
      - run: npm run verify:stem-release
      - run: npm run verify:chord-release
      - run: npm run verify:gpu-runtime
      - run: npm run ytdlp:search
      - run: npm run verify:ytdlp-search-release
      - run: npm run ffmpeg:runtime
      - run: npm run verify:ffmpeg-release
      - name: Run application quality gate
        run: npm run quality
      - name: Free build caches before the large GPU package
        run: |
          $uvCacheDir = uv cache dir
          uv cache clean
          New-Item -ItemType Directory -Force -Path $uvCacheDir | Out-Null
          cargo clean --manifest-path src-tauri/Cargo.toml
      # NSIS cannot create installers above 2 GiB. Keep this edition portable
      # and split its Zip64 archive below GitHub's per-asset size limit.
      - name: Build portable NVIDIA GPU application
        run: npm exec tauri build -- --target x86_64-pc-windows-msvc --no-bundle --config src-tauri/tauri.nvidia-gpu.conf.json
      - name: Verify and upload multipart Windows GPU application
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP "SonArcan-Windows-x86_64-NVIDIA-GPU-$env:GITHUB_REF_NAME"
          New-Item -ItemType Directory -Path $portableRoot | Out-Null
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/sonarcan.exe" (Join-Path $portableRoot "SonArcan NVIDIA GPU.exe")
          Copy-Item "src-tauri/resources/python-runtime" $portableRoot -Recurse
          Copy-Item "src-tauri/resources/models" $portableRoot -Recurse
          Copy-Item "src-tauri/resources/ytdlp-search" $portableRoot -Recurse
          Copy-Item "src-tauri/resources/audio-tools" $portableRoot -Recurse
          npm run verify:bundled-release -- "$portableRoot"
          Remove-Item -LiteralPath "src-tauri/resources/python-runtime" -Recurse -Force
          Remove-Item -LiteralPath "src-tauri/resources/models" -Recurse -Force

          $archive = "$portableRoot.zip"
          tar.exe -a -cf $archive -C (Split-Path $portableRoot -Parent) (Split-Path $portableRoot -Leaf)
          if ($LASTEXITCODE -ne 0) { throw "Zip64 packaging failed with exit code $LASTEXITCODE" }
          Remove-Item -LiteralPath $portableRoot -Recurse -Force
          $input = [System.IO.File]::OpenRead($archive)
          try {
            $buffer = New-Object byte[] (8MB)
            $partNumber = 0
            while ($input.Position -lt $input.Length) {
              $partPath = "$archive.part-$($partNumber.ToString('000'))"
              $output = [System.IO.File]::Create($partPath)
              try {
                $remaining = [Math]::Min([long](1800MB), [long]($input.Length - $input.Position))
                while ($remaining -gt 0) {
                  $readSize = [int][Math]::Min([long]$buffer.Length, [long]$remaining)
                  $read = $input.Read($buffer, 0, $readSize)
                  if ($read -le 0) { throw "Unexpected end of the portable archive" }
                  $output.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              } finally {
                $output.Dispose()
              }
              $partNumber++
            }
          } finally {
            $input.Dispose()
          }
          Remove-Item -LiteralPath $archive -Force
          $parts = Get-ChildItem "$archive.part-*" | Sort-Object Name
          if (-not $parts) { throw "The multipart Windows archive is missing" }
          $checksum = Join-Path $env:RUNNER_TEMP "SHA256SUMS-Windows-NVIDIA-GPU.txt"
          $parts | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii $checksum
          $assets = @($parts.FullName) + @($checksum)
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "GitHub release upload failed after three attempts" }
            Start-Sleep -Seconds ($attempt * 10)
          }
