name: Release desktop

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:release-version
      - name: Verify pinned macOS/Linux FFmpeg sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run verify:audio-tools-source
      - name: Recreate draft release before parallel uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft_ids="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id"
          )"

          while IFS= read -r draft_id; do
            if [[ -n "$draft_id" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$draft_id"
            fi
          done <<< "$draft_ids"

          release_args=(--draft --notes-file RELEASE_NOTES.md --title "SonArcan $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${release_args[@]}"

  build-executorch-runtime:
    name: Build ExecuTorch runtime (${{ matrix.label }})
    needs: prepare-release
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            artifact: executorch-runtime-macos-arm64
          - label: Linux x64
            os: ubuntu-22.04
            artifact: executorch-runtime-linux-x64
            cuda_repository: ubuntu2204/x86_64
          - label: Linux arm64
            os: ubuntu-24.04-arm
            artifact: executorch-runtime-linux-arm64
            cuda_repository: ubuntu2404/sbsa
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pytorch/executorch
          ref: v1.4.1
          submodules: recursive
          path: vendor/executorch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the Apple Metal compiler used to build the MLX delegate
        if: runner.os == 'macOS'
        run: bash scripts/ensure-metal-toolchain.sh
      - name: Install CUDA 12.6 build toolkit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda_repository }}/cuda-keyring_1.1-1_all.deb" \
            --output "$RUNNER_TEMP/cuda-keyring.deb"
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-12-6
      - run: python -m pip install "cmake>=3.29,<4" "PyYAML==6.0.3" "torch==2.13.0"
      - run: npm ci
      - name: Build selective native worker
        shell: bash
        env:
          SONARCAN_EXECUTORCH_SOURCE: ${{ github.workspace }}/vendor/executorch
          SONARCAN_EXECUTORCH_PYTHON: ${{ env.pythonLocation }}/python
          SONARCAN_EXECUTORCH_BUILD_DIR: ${{ runner.temp }}/sonarcan-executorch-build
          SONARCAN_EXECUTORCH_CUDA: ${{ runner.os == 'Linux' && '1' || '0' }}
          SONARCAN_EXECUTORCH_MLX: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: npm run executorch:runtime
      - name: Verify native worker contract
        shell: bash
        run: |
          worker="src-tauri/resources/executorch-runtime/sonarcan-executorch-worker"
          chmod 755 "$worker"
          test "$("$worker" --version)" = "sonarcan-executorch-worker 1.4.1 SACTEN01"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/resources/executorch-runtime/sonarcan-executorch-worker*
            src-tauri/resources/executorch-runtime/mlx.metallib
            src-tauri/resources/executorch-runtime/libaoti_cuda_shims.so
          if-no-files-found: error
          retention-days: 1

  release-macos:
    name: Release macOS Apple Silicon
    needs: [prepare-release, build-executorch-runtime]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Apple Silicon requires signed executable code. The ad-hoc identity keeps
      # the bundle internally consistent without claiming Apple verification.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: executorch-runtime-macos-arm64
          path: src-tauri/resources/executorch-runtime
      - run: chmod 755 src-tauri/resources/executorch-runtime/sonarcan-executorch-worker
      - run: npm run verify:release-version
      - run: npm run verify:native-release
      - name: Prepare pinned yt-dlp search artifact
        run: npm run ytdlp:search
      - run: npm run verify:ytdlp-search-release
      - name: Restore pinned FFmpeg runtime
        id: ffmpeg-runtime-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/resources/audio-tools
          key: ffmpeg-8.0.3-lame-3.100-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg-runtime.sh') }}
      - name: Assemble pinned FFmpeg runtime
        if: steps.ffmpeg-runtime-cache.outputs.cache-hit != 'true'
        run: npm run ffmpeg:runtime
      - run: npm run verify:ffmpeg-release
      - name: Run application quality gate
        run: npm run quality:shared
      - name: Ad-hoc sign embedded release binaries
        run: npm run sign:release-resources
      - name: Build ad-hoc signed app and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SonArcan ${{ github.ref_name }}
          generateReleaseNotes: false
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.macos-arm.conf.json
      - name: Verify bundled macOS resources
        run: |
          app_bundle="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SonArcan.app"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          codesign --display --verbose=4 "$app_bundle" 2>&1 | grep -F "Signature=adhoc"
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app_bundle/Contents/Info.plist")"
          test -n "$icon_name"
          test -s "$app_bundle/Contents/Resources/$icon_name"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSTypeIsPackage' "$app_bundle/Contents/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$app_bundle/Contents/Info.plist")" = "music.sonarcan.project"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeIdentifier' "$app_bundle/Contents/Info.plist")" = "music.sonarcan.project"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeConformsTo:0' "$app_bundle/Contents/Info.plist")" = "com.apple.package"
          test -x "$app_bundle/Contents/Resources/audio-tools/bin/ffmpeg"
          test -x "$app_bundle/Contents/Resources/audio-tools/bin/ffprobe"
          "$app_bundle/Contents/Resources/audio-tools/bin/ffmpeg" -hide_banner -version
          "$app_bundle/Contents/Resources/audio-tools/bin/ffprobe" -hide_banner -version
          "$app_bundle/Contents/Resources/ytdlp-search/yt-dlp" --version
          npm run verify:bundled-release -- "$app_bundle"
          npm run verify:lightweight-bundle -- "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
      - name: Generate DMG checksum
        run: |
          dmg_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          dmg_path="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          cd "$dmg_dir"
          shasum -a 256 "$(basename "$dmg_path")" > SHA256SUMS.txt
          shasum -a 256 --check SHA256SUMS.txt
      - name: Upload DMG checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" \
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt \
              --clobber; then
              exit 0
            fi
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
  release-linux:
    name: Release Linux ${{ matrix.arch }} DEB
    needs: [prepare-release, build-executorch-runtime]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            runtime: executorch-runtime-linux-x64
          - arch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            runtime: executorch-runtime-linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      SONARCAN_GPU_BACKEND: nvidia
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.runtime }}
          path: src-tauri/resources/executorch-runtime
      - run: chmod 755 src-tauri/resources/executorch-runtime/sonarcan-executorch-worker
      - run: npm run verify:release-version
      - run: npm run verify:native-release
      - run: npm run ytdlp:search
      - run: npm run verify:ytdlp-search-release
      - run: npm run ffmpeg:runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify:ffmpeg-release
      - name: Run application quality gate
        run: npm run quality:shared
      - name: Build native DEB
        run: npm exec tauri build -- --target ${{ matrix.target }} --bundles deb
      - name: Verify and upload lightweight Linux DEB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verification_root="$(mktemp -d)"
          deb_path="$(find src-tauri/target/${{ matrix.target }}/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_path"
          dpkg-deb -x "$deb_path" "$verification_root/deb"
          npm run verify:bundled-release -- "$verification_root/deb"
          npm run verify:lightweight-bundle -- "$verification_root/deb"
          rm -rf "$verification_root"

          portable_name="SonArcan-Linux-${{ matrix.arch }}-${GITHUB_REF_NAME}.deb"
          portable_path="$RUNNER_TEMP/$portable_name"
          mv "$deb_path" "$portable_path"
          checksum_path="$RUNNER_TEMP/SHA256SUMS-Linux-${{ matrix.arch }}-DEB.txt"
          (cd "$RUNNER_TEMP" && sha256sum "$portable_name" > "$(basename "$checksum_path")")
          (cd "$RUNNER_TEMP" && sha256sum --check "$(basename "$checksum_path")")
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" "$portable_path" "$checksum_path" --clobber; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
          rm -f "$portable_path" "$checksum_path"
