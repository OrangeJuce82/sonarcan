name: Release desktop

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Apple Silicon requires signed executable code. The ad-hoc identity keeps
      # the bundle internally consistent without claiming Apple verification.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            tools/sonarcan-mlx-worker/uv.lock
            tools/sonarcan-chord-worker/uv.lock
      - name: Install pinned Python runtime
        run: uv python install 3.12.12
      - run: npm ci
      - run: npm run verify:release-version
      - name: Restore converted MLX model
        id: mlx-model-cache
        uses: actions/cache@v5
        with:
          path: |
            src-tauri/resources/models/demucs-mlx/htdemucs_6s.safetensors
            src-tauri/resources/models/demucs-mlx/htdemucs_6s_config.json
          key: mlx-model-htdemucs-6s-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/sonarcan-mlx-worker/uv.lock', 'tools/sonarcan-mlx-worker/src/sonarcan_mlx_worker/build_model.py') }}
      - name: Convert official HTDemucs 6s model
        if: steps.mlx-model-cache.outputs.cache-hit != 'true'
        run: npm run mlx:model
      - name: Assemble pinned release runtime
        run: npm run mlx:runtime
      - run: npm run verify:mlx-release
      - name: Share the reusable HTDemucs model
        uses: actions/upload-artifact@v6
        with:
          name: htdemucs-6s-model
          path: |
            src-tauri/resources/models/demucs-mlx/htdemucs_6s.safetensors
            src-tauri/resources/models/demucs-mlx/htdemucs_6s_config.json
          if-no-files-found: error
      - name: Prepare pinned Beat This! model
        run: npm run chords:downbeat-model
      - name: Assemble pinned LV-Chordia runtime
        run: npm run chords:runtime
      - run: npm run verify:chord-release
      - name: Prepare pinned yt-dlp search artifact
        run: npm run ytdlp:search
      - run: npm run verify:ytdlp-search-release
      - name: Restore pinned FFmpeg runtime
        id: ffmpeg-runtime-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/resources/audio-tools
          key: ffmpeg-8.0.3-lame-3.100-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg-runtime.sh') }}
      - name: Assemble pinned FFmpeg runtime
        if: steps.ffmpeg-runtime-cache.outputs.cache-hit != 'true'
        run: npm run ffmpeg:runtime
      - run: npm run verify:ffmpeg-release
      - name: Qualify MLX separation performance
        run: npm run qualify:stem-performance
      - run: npm run quality
      - name: Ad-hoc sign embedded release binaries
        run: npm run sign:release-resources
      - name: Build ad-hoc signed app and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SonArcan ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.macos-arm.conf.json
      - name: Verify bundled macOS resources
        env:
          # The verification invokes the bundled interpreter after ad-hoc
          # signing; bytecode writes would invalidate its code signatures.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          app_bundle="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SonArcan.app"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          codesign --display --verbose=4 "$app_bundle" 2>&1 | grep -F "Signature=adhoc"
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app_bundle/Contents/Info.plist")"
          test -n "$icon_name"
          test -s "$app_bundle/Contents/Resources/$icon_name"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSTypeIsPackage' "$app_bundle/Contents/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$app_bundle/Contents/Info.plist")" = "music.sonarcan.project"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeIdentifier' "$app_bundle/Contents/Info.plist")" = "music.sonarcan.project"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeConformsTo:0' "$app_bundle/Contents/Info.plist")" = "com.apple.package"
          test -x "$app_bundle/Contents/Resources/audio-tools/bin/ffmpeg"
          test -x "$app_bundle/Contents/Resources/audio-tools/bin/ffprobe"
          "$app_bundle/Contents/Resources/audio-tools/bin/ffmpeg" -hide_banner -version
          "$app_bundle/Contents/Resources/audio-tools/bin/ffprobe" -hide_banner -version
          "$app_bundle/Contents/Resources/chord-runtime/runtime/bin/python3.12" -m sonarcan_chord_worker.worker --self-test --downbeat-model "$app_bundle/Contents/Resources/models/beat-this/final0.ckpt"
          "$app_bundle/Contents/Resources/chord-runtime/runtime/bin/python3.12" "$app_bundle/Contents/Resources/ytdlp-search/yt-dlp" --version
          npm run verify:bundled-release -- "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
      - name: Generate DMG checksum
        run: |
          dmg_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          dmg_path="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          cd "$dmg_dir"
          shasum -a 256 "$(basename "$dmg_path")" > SHA256SUMS.txt
          shasum -a 256 --check SHA256SUMS.txt
      - name: Upload DMG checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt \
            --clobber

  portable:
    name: Release ${{ matrix.name }}
    needs: release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
            bundles: app,dmg
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            bundles: deb,appimage
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-2025
            bundles: nsis
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            tools/sonarcan-torch-worker/uv.lock
            tools/sonarcan-chord-worker/uv.lock
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf
      - run: uv python install 3.12.12
      - run: npm ci
      - run: npm run verify:release-version
      - uses: actions/download-artifact@v7
        with:
          name: htdemucs-6s-model
          path: src-tauri/resources/models/demucs-mlx
      - run: npm run chords:downbeat-model
      - run: npm run chords:runtime
      - run: npm run verify:chord-release
      - run: npm run stems:runtime
      - run: npm run verify:stem-release
      - run: npm run ytdlp:search
      - run: npm run verify:ytdlp-search-release
      - run: npm run ffmpeg:runtime
      - run: npm run verify:ffmpeg-release
      - name: Qualify portable separation performance
        run: npm run qualify:stem-performance
      - run: npm run quality
      - name: Ad-hoc sign embedded macOS binaries
        if: runner.os == 'macOS'
        run: npm run sign:release-resources
      - name: Build bundle and upload it to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SonArcan ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.portable.conf.json
      - name: Verify packaged macOS Intel application
        if: runner.os == 'macOS'
        run: |
          app_bundle="src-tauri/target/${{ matrix.target }}/release/bundle/macos/SonArcan.app"
          npm run verify:bundled-release -- "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
      - name: Verify packaged Linux applications
        if: runner.os == 'Linux'
        run: |
          verification_root="$(mktemp -d)"
          deb_path="$(find src-tauri/target/${{ matrix.target }}/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage_path="$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb_path"
          test -n "$appimage_path"
          dpkg-deb -x "$deb_path" "$verification_root/deb"
          npm run verify:bundled-release -- "$verification_root/deb"
          mkdir "$verification_root/appimage"
          cd "$verification_root/appimage"
          "$GITHUB_WORKSPACE/$appimage_path" --appimage-extract >/dev/null
          cd "$GITHUB_WORKSPACE"
          npm run verify:bundled-release -- "$verification_root/appimage/squashfs-root"
          rm -rf "$verification_root"
      - name: Install and verify packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer is missing" }
          $installRoot = Join-Path $env:RUNNER_TEMP "sonarcan-release-verification"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($process.ExitCode)" }
          npm run verify:bundled-release -- "$installRoot"
