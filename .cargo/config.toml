[build]
rustflags = ["-D", "warnings"]

# Keep Rust, C and C++ dependencies on the same deployment target as the Tauri
# bundle. This also applies to direct `cargo build`/`cargo run` development,
# where Tauri's bundle setting is otherwise not visible to native build scripts.
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# Cargo otherwise repeats a future-incompatibility summary for the `block`
# crate pulled by Metal/wgpu. The exception is tracked and time-bounded in
# SECURITY.md; compiler warnings in SonArcan remain hard errors above.
[future-incompat-report]
frequency = "never"
