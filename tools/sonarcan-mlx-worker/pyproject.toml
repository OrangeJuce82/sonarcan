[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarcan-mlx-worker"
version = "0.1.0"
description = "Private, structured MLX Fast/HQ stem-separation worker for SonArcan"
requires-python = "==3.13.*"
dependencies = [
  "demucs-mlx[convert]==1.4.6",
  "sonarcan-scnet-infer[mlx]",
]

[project.scripts]
sonarcan-mlx-worker = "sonarcan_mlx_worker.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = "==0.9.26"

[tool.uv.sources]
sonarcan-scnet-infer = { path = "../sonarcan-scnet-infer" }

[dependency-groups]
dev = []
