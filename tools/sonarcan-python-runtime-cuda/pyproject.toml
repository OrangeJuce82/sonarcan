[project]
name = "sonarcan-python-runtime-cuda"
version = "0.1.0"
description = "Pinned NVIDIA CUDA runtime for SonArcan Windows and Linux releases"
requires-python = "==3.13.*"
dependencies = [
  "sonarcan-lv-chordia-worker",
  "sonarcan-torch-worker",
  "triton==3.7.1 ; sys_platform == 'linux'",
]

[tool.uv]
required-version = "==0.9.26"
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
no-build-isolation-package = ["madmom"]
override-dependencies = ["torch==2.13.0+cu126"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
sonarcan-lv-chordia-worker = { path = "../sonarcan-chord-worker" }
sonarcan-torch-worker = { path = "../sonarcan-torch-worker" }
torch = { index = "pytorch-cu126" }
triton = { index = "pytorch-cu126" }

[dependency-groups]
dev = []
