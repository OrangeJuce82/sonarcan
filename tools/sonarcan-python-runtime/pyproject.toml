[project]
name = "sonarcan-python-runtime"
version = "0.1.0"
description = "Pinned Apple Silicon runtime for SonArcan releases"
requires-python = "==3.13.*"
dependencies = [
  "sonarcan-lv-chordia-worker",
  "sonarcan-mlx-worker",
  "torch==2.13.0",
  "torchaudio==2.11.0",
]

[tool.uv]
required-version = "==0.9.26"
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
no-build-isolation-package = ["madmom"]

[tool.uv.sources]
sonarcan-lv-chordia-worker = { path = "../sonarcan-chord-worker" }
sonarcan-mlx-worker = { path = "../sonarcan-mlx-worker" }
sonarcan-scnet-infer = { path = "../sonarcan-scnet-infer" }

[dependency-groups]
dev = []
