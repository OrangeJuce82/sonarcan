[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarcan-torch-worker"
version = "0.1.0"
description = "Portable six-stem HTDemucs worker for SonArcan"
requires-python = "==3.13.*"
dependencies = [
  "demucs==4.1.0",
  "numpy==2.3.5",
  "safetensors==0.8.0",
  "torch==2.13.0+cpu; sys_platform == 'linux' or sys_platform == 'win32'",
  "torch==2.13.0; sys_platform != 'linux' and sys_platform != 'win32'",
]

[project.scripts]
sonarcan-torch-worker = "sonarcan_torch_worker.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = "==0.9.26"
environments = [
  "sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = []
