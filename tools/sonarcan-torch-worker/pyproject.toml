[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarcan-torch-worker"
version = "0.1.0"
description = "Portable Fast/HQ four-stem worker for SonArcan"
requires-python = "==3.13.*"
dependencies = [
  "demucs==4.1.0",
  "sonarcan-scnet-infer",
  "torch==2.13.0",
]

[project.scripts]
sonarcan-torch-worker = "sonarcan_torch_worker.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = "==0.9.26"
environments = [
  "sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
sonarcan-scnet-infer = { path = "../sonarcan-scnet-infer" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = []
