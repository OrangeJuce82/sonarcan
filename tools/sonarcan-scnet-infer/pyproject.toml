[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarcan-scnet-infer"
version = "0.1.0"
description = "Pinned inference-only SCNet runtime vendored for SonArcan"
requires-python = "==3.13.*"
license = { file = "LICENSE" }
dependencies = [
  "einops==0.8.1",
  "numpy==2.3.5",
  "packaging==25.0",
  "rotary-embedding-torch==0.8.9",
  "soundfile==0.13.1",
  "torch==2.13.0",
  "typing-extensions==4.15.0",
]

[project.optional-dependencies]
mlx = [
  "mlx==0.31.2",
  "mlx-spectro==0.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scnet_infer = ["config/*.toml"]
