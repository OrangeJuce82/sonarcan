[package]
name = "sonarcan"
version = "0.1.0-beta.23"
description = "Dive into the music."
authors = ["SonArcan contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[lib]
name = "sonarcan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
arc-swap = "1"
cpal = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusty-chromaprint = "0.3.0"
sha2 = "0.10"
rustfft = "6.4"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signalsmith-stretch = "0.1.3"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav"] }
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

# Audio decoding and DSP are unusably slow without optimization (an MP3 that
# decodes in ~120 ms in release can take ~10 s in an otherwise default dev
# build). Level 1 keeps useful debug information and incremental builds while
# removing the worst overhead in SonArcan's sample reduction loop.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
